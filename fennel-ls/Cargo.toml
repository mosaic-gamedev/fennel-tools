[package]
name = "fennel-ls"
version = "0.1.0"
edition = "2021"
description = "A language server for the Fennel programming language (Rust rewrite)"

[[bin]]
name = "fennel-ls"
path = "src/main.rs"

[features]
default = ["luajit"]
luajit = ["mlua/luajit"]
lua54 = ["mlua/lua54"]
lua53 = ["mlua/lua53"]
lua52 = ["mlua/lua52"]
lua51 = ["mlua/lua51"]

[dependencies]
mlua = { version = "0.9", features = ["vendored", "serialize"] }
full_moon = "2"
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[dev-dependencies]
tempfile = "3"
